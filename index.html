.eyebrow{font:700 12px var(--round);letter-spacing:.12em;color:var(--sub)}
.col{background:var(--sun-soft);border-radius:4px 18px 18px 18px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:8px}

.board.grid{--rowh:226px;display:grid;grid-template-columns:repeat(auto-fill,92px);grid-auto-rows:var(--rowh);justify-content:space-between;gap:14px 12px;overflow:visible;padding:14px 0 0;margin:0;

.srcs .chips{flex-wrap:wrap;overflow:visible}
.about{margin:0;font-size:15px;color:var(--sub);line-height:1.8}
.ext{color:var(--ink);font-size:14px;font-weight:700}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.sec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}

details.eds ul.src{font-size:13px}

.gb{display:inline-block;margin-left:10px;vertical-align:middle;line-height:0;background:#fff;border-radius:4px;padding:2px 5px}.gb img{height:15px;width:auto}

.cv img.ndl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;opacity:0;transition:opacity .2s}.cv.has img.ndl{opacity:1}.cv.has{box-shadow:0 3px 6px var(--shadow)}

<script>
const EXCLUDE_PUB=/日本障害者リハビリテーション協会|ふきのとう文庫|さいたま市立中央図書館|石田製本/;
// コラム。lead＝本のページに出す書き出し、body＝「つづきを読む」の先
const COLUMNS={
  kagakui:{who:"加岳井, 広",title:"50歳で、はじめての絵本を出した人",draft:true,
    lead:["『だるまさんが』を描いたかがくいひろしさんは、絵本作家になる前の28年間、特別支援学校の先生でした。はじめての絵本『おもちのきもち』が出たのは2005年。50歳のときです。",
          "教室では、生徒一人ひとりに合わせて、反応を引き出す教材や、楽しめる授業を考えていたそうです。言葉で返事をするのがむずかしい子もいる教室で、何をしたら笑うのか、どこで体が動くのかを、毎日見ていた人です。"],
    body:["『だるまさんが』は、その3年後に出ました。ページをめくるたびに、だるまさんが転んだり、のびたり、しぼんだりします。まだ言葉を話さない赤ちゃんが、体をゆらして笑う。読んでいる大人も、つい一緒に体が動く。教室で見てきたことが、そのまま一冊になったように見えます。",
          "同じ年に『だるまさんの』、翌年に『だるまさんと』が出て、3冊でひと組になりました。",
          "2009年、かがくいさんは54歳で亡くなりました。絵本作家として過ごしたのは4年ほど。そのあいだに描いた絵本は16冊です。おもち、やかん、おふとん、まくら。家の中にあるものが、ちょっとだけ動き出す話がたくさんあります。",
          "「だるまさん」の3冊は、そのあとも読まれつづけ、1000万部を超えました。亡くなってからは、原画やアイデアノート、先生だったころの授業の記録を集めた展覧会が、各地の美術館をめぐっています。",
          "16冊のどれにも、28年分の教室が入っています。"],
    sources:[["講談社『おもちのきもち』作品ページ（著者紹介）","https://www.kodansha.co.jp/book/products/0000138141"],
             ["北海道新聞「かがくいひろしの世界展①『だるまさんが』」","https://www.hokkaido-np.co.jp/article/1226891/"],

const FORMAT_SERIES=/ボードブック|ビッグブック|大型|大きな|ペーパーバック|普及版|紙芝居|ポケット版|おでかけ|愛蔵版|特装版|新装版|ミニ/;

const $=s=>document.querySelector(s);
const nfkc=s=>(s||"").normalize("NFKC");
const kata=s=>nfkc(s).replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s・,、ー]/g,"");

// 作者の名寄せ用の鍵（「森, 比左志」「森比左志」「わかやまけん／著」の書き方の違いをそろえる）
// 「／」のあとが役割（作・文・絵…）なら外す。「林/木林」のように姓と名の区切りならつなぐ。「A / B絵」のように空白つきは別の人なので前だけ（10/5）
const ROLE=/^[\s〔\[（(]*(著|作|文|絵|訳|編|画|詩|案|さく|え|ぶん|やく|原作|原案|監修|企画|構成|写真|再話|脚本)/;
const slashName=(s,sep)=>s.replace(/\s+[／\/]\s+.*$/,"").replace(/[／\/](.*)$/,(m,t)=>ROLE.test(t)?"":sep+t.replace(/[／\/].*$/,""));
const nw=c=>slashName(nfkc(who(c)),"").replace(/[\s,，・]/g,"");
const np=p=>nfkc(p).replace(/^(株式会社|\(株\))|株式会社$/g,"").trim();
const WHONAME=new Map();
const authorName=a=>nice((WHONAME.get(a)||{name:a}).name);
const COLBYWHO=Object.fromEntries(Object.entries(COLUMNS).map(([id,c])=>[nw(c.who),id]));
const sbase=s=>nfkc(s).split(/\s*;\s*/)[0].trim();
// 「加岳井, 広」→「加岳井 広」、「カール, エリック」→「エリック・カール」、「Carle, Eric」→「Eric Carle」
function nice(c){if(!c)return "";const p=c.split(/,\s*/);if(p.length<2)return c;
  if(/^[A-Za-z]/.test(p[0]))return p[1]+" "+p[0];
  if(/^[ァ-ヶー・]+$/.test(p[0]+p[1]))return p[1]+"・"+p[0];
  return p[0]+" "+p[1];}
function isbn10(i){i=(i||"").replace(/[^0-9X]/g,"");if(i.length===10)return i;if(i.length!==13||!i.startsWith("978"))return "";
  const b=i.slice(3,12);let s=0;for(let k=0;k<9;k++)s+=(10-k)*+b[k];const c=(11-s%11)%11;return b+(c===10?"X":c);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// 仮の表紙：書名から色と形を決める（同じ本はいつも同じ表紙）
const PAL=[["#f7c9b6","#ef8f72","#5a2a1c"],["#bfe0f2","#7bb8dc","#1f3c50"],["#d3eac7","#8cc474","#24401a"],["#fde7a6","#f2b93b","#4a3500"],

function cover(title,size){const h=hash(title),p=PAL[h%PAL.length];const t=nfkc(title).split(/ : |:/)[0];
  return `<div class="cv ${size} s${(h>>4)%4}" style="--a:${p[0]};--b:${p[1]};--c:${p[2]}" aria-hidden="true"><span>${esc(t.slice(0,size==="lg"?18:12))}</span></div>`;}
// 本だなの表紙：国立国会図書館サーチの書影（ISBNで決まる画像。画面に入ったものから読む。無ければ仮の表紙のまま。10/4 Q006）
function wIsbn(w){if(w._isb===undefined){const x=w.eds.map(e=>e.i).find(i=>isbn10(i))||w.px;w._isb=x?isbn13(x):"";}return w._isb;}
// 本だなの表紙：Google ブックス（Q007 A・10/4）。国会図書館の書影は他サイトから埋め込めない（403）ため使わない
// 条件：Powered by Google の表示、Google ブックスへのリンク。表紙のない本は灰色の画像（128x184 / 128x170）が返るので仮の表紙のまま
const THUMB=i=>`https://books.google.com/books/content?vid=ISBN${i}&printsec=frontcover&img=1&zoom=1`;
const GB_LOGO=`<a class="gb" href="https://books.google.com/" target="_blank" rel="noopener"><img src="https://books.google.com/googlebooks/images/poweredby.png" alt="Powered by Google" width="62" height="30"></a>`;
function gbMark(img){const sec=img.closest(".shelf");const h=sec?sec.querySelector("h3"):document.querySelector("#status");
  if(h&&!h.querySelector(".gb"))h.insertAdjacentHTML("beforeend",GB_LOGO);}
// 表紙の候補：今の版（px）→ 新しい版から順。Google に表紙のない版は次の版で試す（最大4つ。10/5）
function wIsbns(w){if(!w._isbs){const eds=w.eds.slice().sort((a,b)=>(b.yr||"").localeCompare(a.yr||""));
  const l=[w.px,...eds.map(e=>e.i)].filter(x=>x&&isbn10(x)).map(isbn13);w._isbs=[...new Set(l)].slice(0,4);}return w._isbs;}
function gbLoad(img){const bad=img.naturalWidth<20||(img.naturalWidth===128&&(img.naturalHeight===184||img.naturalHeight===170));
  if(!bad){img.parentNode.classList.add("has");gbMark(img);return;}gbNext(img);}
function gbNext(img){const l=(img.dataset.alt||"").split(",").filter(Boolean);
  if(!l.length){img.remove();return;}img.dataset.alt=l.slice(1).join(",");img.src=THUMB(l[0]);}
function thumb(w,size){const c=cover(w.t,size),l=wIsbns(w);if(!l.length||!THUMB)return c;
  return c.replace(/<\/div>$/,`<img class="ndl" loading="lazy" decoding="async" alt="" data-alt="${l.slice(1).join(",")}" src="${THUMB(l[0])}" onload="gbLoad(this)" onerror="gbNext(this)"></div>`);}

let REPOF=new Map(),SERIESLIST=[],SEROF=new Map(),WORKS=[],BYWHO=new Map(),BYSER=new Map(),BYNT=new Map(),READY=false,SRC=[],MEMB=new Map(),BYKEY=new Map();

async function load(){
  try{
    const res=await fetch("data.txt");
    const b64=(await res.text()).trim();
    const bin=atob(b64);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    let txt;
    if(u[0]===0x1f&&u[1]===0x8b){
      const ds=new Blob([u.buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
      txt=await new Response(ds).text();
    }else txt=new TextDecoder().decode(u);
    const recs=JSON.parse(txt).filter(r=>!EXCLUDE_PUB.test(r.p));
    const m=new Map();
    for(const r of recs){
      // 同じ書名・同じ出版社は1作品にまとめる（版ごとに作者の書き方がばらばらなため。10/3）
      const key=nt(r.t)+"|"+np(r.p);
      let w=m.get(key);
      if(!w){w={key,t:nfkc(r.t).split(/ : /)[0],y:r.y,c:"",a:"",cs:new Map(),p:r.p,eds:[],L:0,A:[],yr:"9999",s:new Set()};m.set(key,w);}
      const a=nw(r.c);
      if(a){w.cs.set(a,(w.cs.get(a)||0)+1);
        const n=WHONAME.get(a)||{name:who(r.c),forms:new Map()};const f=who(r.c);n.forms.set(f,(n.forms.get(f)||0)+1);WHONAME.set(a,n);}
      w.eds.push(r);if(r.yr&&r.yr<w.yr){w.yr=r.yr;w.p=r.p;}
      if(r.L>w.L)w.L=r.L; if(r.A)for(const a of r.A)if(!w.A.includes(a))w.A.push(a);
      if(r.s)w.s.add(sbase(r.s));
    }
    WORKS=[...m.values()];
    // 作者の表示名：「姓, 名」の形を優先し、いちばん多い書き方
    for(const n of WHONAME.values()){let best=[...n.forms.keys()][0]||"",bs=-Infinity;for(const [f,k] of n.forms){const sc=k+(/,/.test(f)?1e6:0)-(/[／\/]/.test(f)?2e6:0);if(sc>bs){bs=sc;best=f;}}n.name=slashName(nfkc(best)," ").trim();delete n.forms;}
    WORKS.forEach((w,i)=>{
      w.i=i;BYKEY.set(w.key,w);w.score=w.L*3+w.A.length*4+Math.min(w.eds.length,5);
      if(w.cs.size){w.a=[...w.cs].sort((x,y)=>y[1]-x[1])[0][0];w.c=WHONAME.get(w.a).name;}
      for(const a of w.cs.keys()){if(!BYWHO.has(a))BYWHO.set(a,[]);BYWHO.get(a).push(w);}
      for(const s of w.s){if(!BYSER.has(s))BYSER.set(s,[]);BYSER.get(s).push(w);}
      const k=nt(w.t);if(!BYNT.has(k))BYNT.set(k,[]);BYNT.get(k).push(w);
    });
    // 今の版のISBN（ISBNのない昔の本に、楽天で書名＋出版社が合ったものだけ。ISBNだけを残す・Q008）
    try{const P=await (await fetch("isbn_plus.json")).json();for(const k in P){const w=BYKEY.get(k);if(w)w.px=P[k];}}catch(e){}
    try{SRC=await (await fetch("lists.json")).json();
      for(const s of SRC)for(const sec of s.secs)for(const it of sec.items){if(!it[1])continue;
        if(!MEMB.has(it[1]))MEMB.set(it[1],[]);MEMB.get(it[1]).push({s,sec,note:it[2]});}
    }catch(e){SRC=[];}
    // シリーズ（Hiro確定の34＋自動判定。10/3）
    try{const S=await (await fetch("series.json")).json();
      S.forEach((x,si)=>{const ws=[],seen=new Set();
        for(const e of x.k){const ks=Array.isArray(e)?e:[e];
          // 版ちがいは1冊にまとめて、いちばん多く引かれている作品を代表に
          const cand=ks.map(k=>BYKEY.get(k)).filter(Boolean).filter(w=>!seen.has(w));
          if(!cand.length)continue;cand.forEach(w=>seen.add(w));
          const rep=cand.sort((a,b)=>b.score-a.score)[0];ws.push(rep);cand.forEach(w=>REPOF.set(w,rep));}
        ws.sort((a,b)=>a.yr.localeCompare(b.yr));
        if(ws.length<2)return;
        const ser={name:x.n,confirmed:!!x.c,works:ws};SERIESLIST.push(ser);
        for(const w of seen)if(!SEROF.has(w))SEROF.set(w,ser);});
    }catch(e){}
    READY=true;
    render();
  }catch(e){$("#status").textContent="本だなを開けませんでした。ページを開きなおしてください（"+e.message+"）";}
}

const yr=w=>w.yr!=="9999"?w.yr:"";

function ghost(title,why){return `<div class="book ghost" title="まだ索引に入っていない本">${cover(title,"md")}${why?`<span class="why">${esc(why)}</span>`:""}<span class="n">${esc(nfkc(title))}</span><span class="y"></span></div>`;}
function book(w,now,why){return `<button class="book${now?" now":""}" type="button" data-i="${w.i}">${thumb(w,"md")}${why&&!now?`<span class="why">${esc(why)}</span>`:""}<span class="n">${esc(w.t)}</span><span class="y">${yr(w)}</span></button>`;}
// items は本の配列、または {w, why} の配列
function shelf(title,sub,items,now){if(!items.length)return "";
  return `<section class="shelf"><h3>${esc(title)}</h3>${sub?`<p class="sub">${esc(sub)}</p>`:""}<div class="board">${items.map(x=>x.w?book(x.w,x.w===now,x.why):book(x,x===now)).join("")}</div></section>`;}
// この本が載っている賞・図書館のリスト（押すとそのリストへ）
const yrOf=l=>(l.match(/\d{4}/)||[l])[0];
function srcTags(w){const ms=MEMB.get(w.key)||[];if(!ms.length)return tags(w,3);
  const aw=[],lb=new Map();
  for(const m of ms){if(m.s.kind==="award"){const n=m.note&&m.note!==m.s.name?" "+m.note:"";aw.push(`<button type="button" class="tag prize" data-src="${m.s.id}" data-sec="${m.sec.id}">${esc(m.s.name+" "+yrOf(m.sec.label)+n)}</button>`);}
    else if(!lb.has(m.s.id))lb.set(m.s.id,`<button type="button" class="tag" data-src="${esc(m.s.id)}" data-sec="${m.sec.id}">${esc(m.s.name)}</button>`);}
  return `<div class="tags">${aw.concat([...lb.values()]).join("")}</div>`;}
function srcChips(){const g=k=>SRC.filter(s=>s.kind===k).map(s=>`<button class="chip" type="button" data-src="${esc(s.id)}">${esc(s.name)}</button>`).join("");

// 同じ書名は1冊だけ（作者の書き方が版で違うと別の作品になるため）
function uniq(ws,n){const seen=new Set(),out=[];for(const w of ws){const k=nt(w.t);if(seen.has(k))continue;seen.add(k);out.push(w);if(out.length>=n)break;}return out;}
// ---------- はじめの画面と検索結果 ----------
function render(){
  const q=$("#q").value.trim();$("#clear").hidden=!q;
  if(!READY)return;
  if(!q){
    const top=uniq(WORKS.filter(w=>w.L).sort((a,b)=>b.L-a.L||b.score-a.score),16);
    const used=new Set(top.map(w=>nt(w.t)));
    const prize=uniq(WORKS.filter(w=>w.A.length&&!used.has(nt(w.t))).sort((a,b)=>b.A.length-a.A.length||b.score-a.score),16);
    $("#status").textContent=`${WORKS.length.toLocaleString()}作品から探せます。書名のはじめを入れるか、下の本を開いてみてください。`;
    $("#view").innerHTML=`<div class="page">
      ${shelf("図書館がよくすすめている本","全国の図書館・自治体の選書リストに載っている数の順",top)}
      ${colCard("kagakui",false)}
      ${shelf("絵本の賞に選ばれた本","ようちえん絵本大賞・日本絵本賞・MOE絵本屋さん大賞など",prize)}
      ${srcChips()}
    </div>`;
    return;
  }
  const kq=kata(q),nq=nt(q);
  const okw=w=>!isForeign(w)&&!/点訳|点字/.test(w.t);
  let hits=WORKS.filter(w=>w.y&&w.y.startsWith(kq)&&okw(w));
  if(hits.length<5){const seen=new Set(hits);hits=hits.concat(WORKS.filter(w=>!seen.has(w)&&okw(w)&&nt(w.t).includes(nq)));}
  hits.sort((a,b)=>b.score-a.score||a.y.localeCompare(b.y));
  if(!hits.length){
    $("#status").textContent="";
    $("#view").innerHTML=`<div class="empty">「${esc(q)}」ではじまる本は見つかりませんでした。<br>書名の一部だけ、またはひらがなで入れてみてください。</div>`;
    return;
  }
  $("#status").textContent=`${hits.length.toLocaleString()}冊。おすすめに多く載っている本が上にきます`;
  $("#view").innerHTML=`<ul class="list">${hits.slice(0,shown).map(w=>`<li><button class="row" type="button" data-i="${w.i}">${thumb(w,"sm")}<div class="txt"><div class="t">${esc(w.t)}</div><div class="m">${esc(nice(w.c)||"作者不明")}　${esc(w.p)}${yr(w)?"　"+yr(w):""}</div>${tags(w,1)}</div><span class="go" aria-hidden="true"></span></button></li>`).join("")}</ul>
    ${hits.length>shown?`<div style="display:flex;justify-content:center;margin-top:14px"><button class="more" id="more" type="button">つづきを見る（あと ${(hits.length-shown).toLocaleString()}冊）</button></div>`:""}`;
}

const RK=window.RAKUTEN||{};
const RK_ON=!!(RK.appId&&RK.accessKey);

  const b="978"+i.slice(0,9);let s=0;for(let k=0;k<12;k++)s+=(+b[k])*(k%2?3:1);return b+((10-s%10)%10);}
let rkLast=0,rkQ=Promise.resolve();

function rkFind(w){const t=nfkc(w.t).split(/ : |:/)[0].trim(),p=np(w.p).replace(/[,，].*$/,"").replace(/\(.*?\)|（.*?）/g,"").replace(/^.*[:：]\s*/,"").trim();

function rkGet(params,key,pick){

  // 図書館のボタンの下に、目立たない「買う」ボタン（図書館が先。10/4 Hiro）
  const lib=document.querySelector(".page .lib");
  if(r.url&&lib&&!document.querySelector(".buy"))lib.insertAdjacentHTML("afterend",`<a class="buy" href="${esc(r.url)}" target="_blank" rel="noopener">手元に置きたくなったら<b>楽天ブックスで買う</b></a>`);
}
function show(i){
  const w=WORKS[i];
  $("#searchBox").hidden=true;
  const isb=w.eds.map(e=>e.i).find(x=>isbn10(x))||w.px||"";
  // この本に近い本：つづき → おなじ作者（出た順） → おなじシリーズ。おすすめの数では並べない
  // 段ごとに分ける：つづき／おなじ作者／おなじシリーズ（同じ本は上の段に1回だけ）
  const tiers={つづき:[],作者:[],シリーズ:[]},seen=new Set([nt(w.t)]);let serLabel="つづき";
  const add=(x,t)=>{const k=nt(x.t);if(x===w){if(t==="つづき"&&!tiers[t].includes(x))tiers[t].push(x);return;}if(seen.has(k)||isForeign(x))return;seen.add(k);tiers[t].push(x);};
  const ser=SEROF.get(w);
  if(ser){const rep=REPOF.get(w);ser.works.map(x=>x===rep?w:x).forEach(x=>add(x,"つづき"));serLabel=`つづき（${ser.name}・全${ser.works.length}冊）`;}
  (BYWHO.get(w.a)||[]).slice().sort((a,b)=>a.yr.localeCompare(b.yr)).slice(0,40).forEach(x=>add(x,"作者"));
  let serName="";
  for(const s of [...w.s].filter(s=>s&&!FORMAT_SERIES.test(s))){
    if(!serName)serName=s.split(/[.．]\s*/)[0];
    (BYSER.get(s)||[]).slice().sort((a,b)=>a.yr.localeCompare(b.yr)).slice(0,12).forEach(x=>add(x,"シリーズ"));
  }
  const rows=[[serLabel,tiers.つづき],[`おなじ作者（${authorName(w.a)}）`,tiers.作者],[`おなじシリーズ（${serName}）`,tiers.シリーズ]]
    .filter(([,l])=>l.some(x=>x!==w));
  const nearHtml=rows.length?`<section class="shelf near"><h3>この本に近い本</h3>${rows.map(([lab,l])=>`<div class="tier"><h4><span>${esc(lab)}</span>${l===tiers.作者?`<button type="button" data-who="${encodeURIComponent(w.a)}">ぜんぶ見る</button>`:""}</h4><div class="board">${l.map(x=>book(x,x===w)).join("")}</div></div>`).join("")}</section>`:"";
  const col=COLBYWHO[w.a];
  const eds=w.eds.slice().sort((a,b)=>(a.yr||"").localeCompare(b.yr||"")).map(e=>`<li>${e.yr||"不明"}<span>${esc(e.p)}${e.s?"　"+esc(e.s):""}</span></li>`).join("");
  const facts=esc(w.p)+(yr(w)?`<br>${yr(w)}年に出た本`:"");
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <div class="hero"><div>${thumb(w,"lg").replace('class="cv ',`data-isbn="${esc(isb||"")}" class="cv `)}</div><div class="txt"><h2>${esc(w.t)}</h2><p class="who">${w.a?`<button type="button" class="wholink" data-who="${encodeURIComponent(w.a)}">${esc(authorName(w.a))}<span>の本をぜんぶ見る</span></button>`:"作者不明"}</p><p class="pub">${facts}</p>${srcTags(w)}</div></div>
    ${isb?`<a class="lib" href="https://calil.jp/book/${isbn10(isb)}" target="_blank" rel="noopener">${PIN}<span><b>近くの図書館でさがす</b><small>カーリルで、図書館にあるか・いま借りられるかを見ます</small></span></a>`
         :`<a class="lib off" href="https://calil.jp/search?q=${encodeURIComponent(w.t)}" target="_blank" rel="noopener">${PIN}<span><b>書名で図書館をさがす</b><small>この版は ISBN がないため、カーリルで書名から探します</small></span></a>`}
    ${col?colCard(col,true):""}
    ${nearHtml}
    <details class="eds"><summary>この本の版（${w.eds.length}）</summary><ul>${eds}</ul>${isb?`<p class="gbl"><a href="https://books.google.com/books?vid=ISBN${isbn13(isb)}" target="_blank" rel="noopener">Google ブックスでこの本を見る</a></p>`:""}</details>
  </div>`;
  heroCover(isb,w);
  window.scrollTo(0,0);
}

function backBar(){const prev=stack[stack.length-2];
  const label=prev===undefined?"さがす画面へ":prev.startsWith("c")?"コラムへもどる":prev.startsWith("s")?"リストへもどる":prev.startsWith("a")?"作者のページへ":"まえの本へ";
  return `<div class="bar"><button class="back" id="back" type="button">${label}</button></div>`;}

// ---------- コラムのページ ----------
function showCol(id){
  const c=COLUMNS[id];$("#searchBox").hidden=true;
  const works=uniq((BYWHO.get(nw(c.who))||[]).filter(x=>!isForeign(x)).sort((a,b)=>a.yr.localeCompare(b.yr)),40);
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <article class="essay">
      <div class="eyebrow">コラム${c.draft?"・下書き":""}</div>
      <h2>${esc(c.title)}</h2>
      ${c.lead.concat(c.body).map(p=>`<p>${esc(p)}</p>`).join("")}
    </article>
    ${shelf(`${authorName(nw(c.who))}さんの絵本`,"出た順。開くと、近くの図書館でさがせます",works)}
    <details class="eds"><summary>このコラムの出典（${c.sources.length}）</summary><ul class="src">${c.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul></details>
  </div>`;
  window.scrollTo(0,0);
}
// ---------- 賞・図書館のリストのページ ----------
function showSrc(sid,secId){
  const s=SRC.find(x=>x.id===sid);if(!s)return;$("#searchBox").hidden=true;
  const secs=s.secs.map(sec=>{
    const items=sec.items.map(it=>{const w=it[1]&&BYKEY.get(it[1]);return w?book(w,false,it[2]):ghost(it[0],it[2]);}).join("");
    return `<section class="shelf sec" id="sec-${sec.id}"><h3>${esc(sec.label)}${sec.age?`<small>${esc(sec.age)}</small>`:""}</h3><div class="board grid">${items}</div></section>`;}).join("");
  const n=s.secs.reduce((a,x)=>a+x.items.length,0);
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="eyebrow">${s.kind==="award"?"絵本の賞":"図書館・自治体のおすすめ"}</div>
      <h2 style="font:900 26px/1.35 var(--round);margin:0;text-wrap:balance">${esc(s.name)}</h2>
      <p class="about">${esc(s.about)}。${s.kind==="award"?`${s.secs.length}回ぶん、${n}冊。新しい回が上です。`:`${n}冊。`}</p>
      <a class="ext" href="${s.url}" target="_blank" rel="noopener">${s.kind==="award"?"賞の公式ページ":"リストの元のページ"}を見る</a>
    </div>
    ${s.secs.length>3?`<div class="jump">${s.secs.map(x=>`<button class="chip" type="button" data-jump="sec-${x.id}">${esc(s.kind==="award"?x.label.replace(/第\d+回（(.*?)）/,"$1"):x.label.slice(0,14))}</button>`).join("")}</div>`:""}
    ${secs}
  </div>`;
  const t=secId&&document.getElementById("sec-"+secId);
  if(t)t.scrollIntoView({block:"start"});else window.scrollTo(0,0);
}
// ---------- 作者のページ ----------
function showWho(c){
  $("#searchBox").hidden=true;
  const all=uniq((BYWHO.get(c)||[]).filter(x=>!isForeign(x)).sort((a,b)=>a.yr.localeCompare(b.yr)),400);
  const col=COLBYWHO[c];
  // 冊数が多い作者は、出た年代ごとの段に分ける
  const groups=new Map();
  for(const x of all){const d=yr(x)?`${yr(x).slice(0,3)}0年代`:"年がわからない本";if(!groups.has(d))groups.set(d,[]);groups.get(d).push(x);}
  const first=all.find(x=>yr(x)),last=[...all].reverse().find(x=>yr(x));
  const span=first&&last?(first.yr===last.yr?`${first.yr}年`:`${first.yr}年から${last.yr}年まで`):"";
  const body=all.length>12
    ?[...groups].map(([d,l])=>`<section class="shelf"><h3>${esc(d)}<small style="font:700 13px var(--round);color:var(--sub);margin-left:8px">${l.length}冊</small></h3><div class="board grid">${l.map(x=>book(x)).join("")}</div></section>`).join("")
    :`<section class="shelf"><div class="board grid">${all.map(x=>book(x)).join("")}</div></section>`;
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="eyebrow">作者</div>
      <h2 style="font:900 28px/1.3 var(--round);margin:0">${esc(authorName(c))}</h2>
      <p class="about">${all.length}冊${span?`。${span}`:""}。出た順に並べています</p>
    </div>
    ${col?colCard(col,false):""}
    ${body}
  </div>`;
  window.scrollTo(0,0);
}
function go(key){const last=stack[stack.length-1];
  if(key===undefined){$("#searchBox").hidden=false;render();window.scrollTo(0,listScroll);return;}
  if(key.startsWith("c"))showCol(key.slice(1));
  else if(key.startsWith("a"))showWho(decodeURIComponent(key.slice(1)));
  else if(key.startsWith("s")){const [sid,sec]=key.slice(1).split("#");showSrc(sid,sec);}
  else show(+key.slice(1));}

document.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");
  if(j){document.getElementById(j.dataset.jump)?.scrollIntoView({block:"start"});return;}
  const b=e.target.closest("[data-i],[data-col],[data-src],[data-who]");
  if(b){if(!stack.length)listScroll=window.scrollY;
    const key=b.dataset.who?"a"+b.dataset.who:b.dataset.col?"c"+b.dataset.col:b.dataset.src?"s"+b.dataset.src+"#"+(b.dataset.sec||""):"b"+b.dataset.i;
    stack.push(key);go(key);return;}
  if(e.target.closest("#back")){stack.pop();go(stack[stack.length-1]);return;}
  if(e.target.closest("#more")){shown+=40;render();return;}
  const c=e.target.closest(".chip");
  if(c){$("#q").value=c.textContent;shown=40;render();return;}
  if(e.target.closest("#clear")){$("#q").value="";shown=40;render();$("#q").focus();}
});
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);shown=40;tm=setTimeout(render,120);});
if(RK_ON){const n=document.getElementById("coverNote");if(n)n.innerHTML='表紙は本を開いたときに<a href="https://books.rakuten.co.jp/" target="_blank" rel="noopener">楽天ブックス</a>から読み込みます（<a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Supported by Rakuten Developers</a>）。';}
render();load();
</script>

</body></html>
