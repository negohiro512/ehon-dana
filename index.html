}

<div class="app">

const RK=window.RAKUTEN||{};
const RK_ON=!!(RK.appId&&RK.accessKey);
function isbn13(i){i=(i||"").replace(/[^0-9X]/g,"");if(i.length===13)return i;if(i.length!==10)return "";
  const b="978"+i.slice(0,9);let s=0;for(let k=0;k<12;k++)s+=(+b[k])*(k%2?3:1);return b+((10-s%10)%10);}
// 楽天への問い合わせは1つの列に並べ、1.1秒に1回。本のページの表紙（pri 1）を本だなの表紙（pri 0）より先に。
// 画面から消えた本だなの分は、聞かずに飛ばす（10/5）
let rkLast=0,rkPend=[],rkBusy=false;
async function rkRun(){if(rkBusy)return;rkBusy=true;
  while(rkPend.length){const j=rkPend.shift();if(j.live&&!j.live()){j.res(null);continue;}
    const wait=rkLast+1100-Date.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));
    if(j.live&&!j.live()){j.res(null);continue;}rkLast=Date.now();j.res(await j.fn());}
  rkBusy=false;}
function rkCover(isbn,pri=1,live){return rkGet({isbn},"rk5:"+isbn,it=>it[0],pri,live);}
// ISBNのない本：書名＋出版社で楽天を引き、書名と出版社が合うものだけ使う（10/4）
const rkn=s=>nfkc(s).replace(/[\s　・,，、。.!！?？「」『』()（）\[\]〜~ー～:：-]/g,"");
function rkFind(w,pri=1,live){const t=nfkc(w.t).split(/ : |:/)[0].trim(),p=np(w.p).replace(/[,，].*$/,"").replace(/\(.*?\)|（.*?）/g,"").replace(/^.*[:：]\s*/,"").trim();
  if(!t||!p)return Promise.resolve(null);
  return rkGet({title:t,publisherName:p,hits:"10"},"rkt5:"+t+"|"+p,its=>its.find(it=>rkn(it.title)===rkn(t)&&rkn(it.publisherName||"").includes(rkn(p).slice(0,3))),pri,live);}
function rkGet(params,key,pick,pri=1,live){
  try{const c=sessionStorage.getItem(key);if(c!==null)return Promise.resolve(JSON.parse(c));}catch(e){}
  return new Promise(res=>{rkPend.push({pri,live,res,fn:async()=>{
    // outOfStockFlag=1：品切れ・販売終了の本も返してもらう（表紙だけでも出したい。既定の0だと出てこない。10/5 ふしぎなでまえ）
    const u="https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404?"+new URLSearchParams({applicationId:RK.appId,accessKey:RK.accessKey,format:"json",formatVersion:"2",outOfStockFlag:"1",...params});
    // 楽天の回数制限（サイト全体で1秒に1回）にかかった返事は「表紙なし」として覚えない。少し待って2回までやり直す（10/5 かがくいひろしの2冊で表紙が出なかった）
    for(let t=0;t<3;t++){
      if(t){await new Promise(r=>setTimeout(r,1500*t));if(live&&!live())return null;}
      rkLast=Date.now();
      try{const j=await (await fetch(u)).json();
        if(!Array.isArray(j.Items))continue;
        const it=pick(j.Items.map(x=>x.Item||x));
        // 楽天の「NO IMAGE 画像はありません」の絵は表紙として使わない（仮の表紙のほうがよい。10/5 Hiro）
        const im=it?(it.largeImageUrl||it.mediumImageUrl||""):"",noimg=/noimage|no_image|now_?printing|\.gif(\?|$)/i.test(im);
        const r=it?{img:noimg?"":im.replace(/\?_ex=\d+x\d+$/,"?_ex=300x300"),isbn:it.isbn||"",url:/^https:\/\/books\.rakuten\.co\.jp\//.test(it.itemUrl||"")?it.itemUrl:""}:null;
        try{sessionStorage.setItem(key,JSON.stringify(r));}catch(e){}return r;}catch(e){}}
    return null;
  }});rkPend.sort((a,b)=>b.pri-a.pri);rkRun();});

    <div class="hero"><div>${thumb(w,"lg").replace('class="cv ',`data-isbn="${esc(isb||"")}" class="cv `)}</div><div class="txt"><h2>${esc(w.t)}</h2><p class="who">${w.a?`<button type="button" class="wholink" data-who="${encodeURIComponent(w.a)}">${esc(authorName(w.a))}<span>の本をぜんぶ見る</span></button>`:"作者不明"}</p><p class="pub">${facts}</p>${srcTags(w)}</div></div>
    ${isb?`<a class="lib" href="https://calil.jp/book/${isbn10(isb)}" target="_blank" rel="noopener">${PIN}<span><b>近くの図書館でさがす</b><small>カーリルで、図書館にあるか・いま借りられるかを見ます</small></span></a>`
         :`<a class="lib off" href="https://calil.jp/search?q=${encodeURIComponent(w.t)}" target="_blank" rel="noopener">${PIN}<span><b>書名で図書館をさがす</b><small>この版は ISBN がないため、カーリルで書名から探します</small></span></a>`}
    ${col?colCard(col,true):""}
    ${nearHtml}
    <details class="eds"><summary>この本の版（${w.eds.length}）</summary><ul>${eds}</ul>${isb?`<p class="gbl"><a href="https://books.google.com/books?vid=ISBN${isbn13(isb)}" target="_blank" rel="noopener">Google ブックスでこの本を見る</a></p>`:""}</details>
  </div>`;
  heroCover(isb,w);
  window.scrollTo(0,0);
}

function backBar(){const prev=stack[stack.length-2];
  const label=prev===undefined?"さがす画面へ":prev.startsWith("c")?"コラムへもどる":prev.startsWith("s")?"リストへもどる":prev.startsWith("a")?"作者のページへ":prev.startsWith("t")?"特集へもどる":"まえの本へ";
  return `<div class="bar"><button class="back" id="back" type="button">${label}</button><span style="flex:1"></span>
    <button class="barbtn" id="tosearch" type="button" aria-label="書名でさがす"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <button class="barbtn" id="tohome" type="button" aria-label="はじめの画面へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg></button></div>`;}

// ---------- コラムのページ ----------
function showCol(id){
  const c=COLUMNS[id];if(!c)throw new Error("no column");$("#searchBox").hidden=true;
  const works=pairUp(withPairs(uniq((BYWHO.get(ROOT(nw(c.who)))||[]).filter(x=>!isForeign(x)&&!x.en).sort((a,b)=>a.yr.localeCompare(b.yr)),40)));
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <article class="essay">
      <div class="eyebrow">コラム${c.draft?"・下書き":""}</div>
      <h2>${esc(c.title)}</h2>
      ${c.lead.concat(c.body).map(p=>`<p>${colText(p,c)}</p>`).join("")}
    </article>
    ${shelf(`${authorName(ROOT(nw(c.who)))}さんの絵本`,"出た順。開くと、近くの図書館でさがせます",works)}
    <details class="eds"><summary>このコラムの出典（${c.sources.length}）</summary><ul class="src">${c.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul></details>
  </div>`;
  window.scrollTo(0,0);
}
// ---------- 賞・図書館のリストのページ ----------
function showSrc(sid,secId){
  const s=SRC.find(x=>x.id===sid);if(!s)throw new Error("no list");$("#searchBox").hidden=true;
  const secs=s.secs.map(sec=>{
    const items=sec.items.map(it=>{const w=it[1]&&BYKEY.get(it[1]);return w?book(w,false,it[2]):ghost(it[0],it[2]);}).join("");
    return `<section class="shelf sec" id="sec-${sec.id}"><h3>${esc(sec.label)}${sec.age?`<small>${esc(sec.age)}</small>`:""}</h3><div class="board grid">${items}</div></section>`;}).join("");
  const n=s.secs.reduce((a,x)=>a+x.items.length,0);
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="eyebrow">${s.kind==="award"?"絵本の賞":"図書館・自治体のおすすめ"}</div>
      <h2 style="font:700 26px/1.35 var(--round);margin:0;text-wrap:balance">${esc(s.name)}</h2>
      <p class="about">${esc(s.about)}。${s.kind==="award"?`${s.secs.length}回ぶん、${n}冊。新しい回が上です。`:`${n}冊。`}</p>
      <a class="ext" href="${s.url}" target="_blank" rel="noopener">${s.kind==="award"?"賞の公式ページ":"リストの元のページ"}を見る</a>
    </div>
    ${s.secs.length>3?`<div class="jump">${s.secs.map(x=>`<button class="chip" type="button" data-jump="sec-${x.id}">${esc(s.kind==="award"?x.label.replace(/第\d+回（(.*?)）/,"$1"):x.label.slice(0,14))}</button>`).join("")}</div>`:""}
    ${secs}
  </div>`;
  const t=secId&&document.getElementById("sec-"+secId);
  if(t)t.scrollIntoView({block:"start"});else window.scrollTo(0,0);
}
// ---------- 作者のページ ----------
function showWho(c){
  $("#searchBox").hidden=true;
  const every=pairUp(withPairs(uniq((BYWHO.get(c)||[]).filter(x=>!isForeign(x)).sort((a,b)=>a.yr.localeCompare(b.yr)),400)));
  const all=every.filter(x=>!x.en);
  // 原書・外国語版は、日本語の本とは別の本だなに（日本語版の書名を札に書く）
  const origs=[...new Set([...every.filter(x=>x.en),...all.flatMap(x=>x.orig||[])])].sort((a,b)=>a.yr.localeCompare(b.yr));
  const origHtml=origs.length?`<section class="shelf"><h3>原書・外国語版<small style="font:700 13px var(--round);color:var(--sub);margin-left:8px">${origs.length}冊</small></h3><p class="sub">日本語版がわかるものは、その書名を札に書いています</p><div class="board grid">${origs.map(x=>book(x,false,x.jaEd&&x.jaEd.length?"日本語版『"+x.jaEd[0].t+"』":"")).join("")}</div></section>`:"";
  const baseYr=x=>{if(!x.bi)return yr(x);const b=all.find(y=>!y.bi&&nt(y.t)===nt(x.t));return b?yr(b):yr(x);};
  const col=COLBYWHO[c];
  // 冊数が多い作者は、出た年代ごとの段に分ける
  const groups=new Map();
  for(const x of all){const y=baseYr(x);const d=y?`${y.slice(0,3)}0年代`:"年がわからない本";if(!groups.has(d))groups.set(d,[]);groups.get(d).push(x);}
  const first=all.find(x=>yr(x)),last=[...all].reverse().find(x=>yr(x));
  const span=first&&last?(first.yr===last.yr?`${first.yr}年`:`${first.yr}年から${last.yr}年まで`):"";
  const body=all.length>12
    ?[...groups].map(([d,l])=>`<section class="shelf"><h3>${esc(d)}<small style="font:700 13px var(--round);color:var(--sub);margin-left:8px">${l.length}冊</small></h3><div class="board grid">${l.map(x=>book(x)).join("")}</div></section>`).join("")
    :`<section class="shelf"><div class="board grid">${all.map(x=>book(x)).join("")}</div></section>`;
  $("#view").innerHTML=`<div class="page">
    ${backBar()}
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="eyebrow">作者</div>
      <h2 style="font:700 28px/1.3 var(--round);margin:0">${esc(authorName(c))}</h2>
      <p class="about">${all.length}冊${span?`。${span}`:""}。出た順に並べています${origs.length?`（原書・外国語版${origs.length}冊は下の本だなに）`:""}</p>
    </div>
    ${col?colCard(col,false):""}
    ${body}
    ${origHtml}
  </div>`;
  window.scrollTo(0,0);
}
function go(key){try{goTo(key);}catch(e){stack=[];try{history.replaceState({stack:[],d:0},"",urlOf([]));}catch(_){}goTo(undefined);}}
function goTo(key){
  if(key!==undefined)$("#today").hidden=true;
  if(key===undefined){$("#searchBox").hidden=false;render();window.scrollTo(0,listScroll);return;}
  if(key.startsWith("c"))showCol(key.slice(1));
  else if(key.startsWith("a"))showWho(decodeURIComponent(key.slice(1)));
  else if(key.startsWith("t"))showTheme(key.slice(1));
  else if(key.startsWith("s")){const [sid,sec]=key.slice(1).split("#");showSrc(sid,sec);}
  else show(+key.slice(1));}

document.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");
  if(j){document.getElementById(j.dataset.jump)?.scrollIntoView({block:"start"});return;}
  const b=e.target.closest("[data-i],[data-col],[data-src],[data-who],[data-theme]");
  if(b){if(!stack.length)listScroll=window.scrollY;
    const key=b.dataset.theme?"t"+b.dataset.theme:b.dataset.who?"a"+b.dataset.who:b.dataset.col?"c"+b.dataset.col:b.dataset.src?"s"+b.dataset.src+"#"+(b.dataset.sec||""):"b"+b.dataset.i;
    nav(key);return;}
  if(e.target.closest("#back")){goBack();return;}
  if(e.target.closest("#home,#tohome")){goHome(false);return;}
  if(e.target.closest("#tosearch")){goHome(true);return;}
  if(e.target.closest("#more")){shown+=40;render();return;}
  const c=e.target.closest(".chip");
  if(c){$("#q").value=c.textContent;shown=40;render();return;}
  if(e.target.closest("#clear")){$("#q").value="";shown=40;render();$("#q").focus();}
});
// ---------- ブラウザの「戻る」（スワイプ）と、画面ごとのURL（10/5）----------
// 画面を開くたびに履歴に積む。スワイプや戻るボタンでは1つまえの画面へ。#つきのURLを開くと、その画面から始まる
const H=()=>history.state||{stack:[],d:0};
const urlOf=st=>location.pathname+location.search+(st.length?"#"+encodeURIComponent(st[st.length-1]):"");
function nav(key){
  try{history.replaceState({...H(),y:window.scrollY},"");}catch(e){}
  stack.push(key);
  try{history.pushState({stack:stack.slice(),d:(H().d||0)+1},"",urlOf(stack));}catch(e){}
  go(key);}
function goBack(){
  // このサイトの中で積んだ履歴があれば、ブラウザの戻ると同じ動きにする
  if(H().d>0){history.back();return;}
  // 直接開いたページ（#つきのURL）からは、上の画面へ
  stack.pop();try{history.replaceState({stack:stack.slice(),d:0},"",urlOf(stack));}catch(e){}
  go(stack[stack.length-1]);}
window.addEventListener("popstate",e=>{if(!READY)return;
  const st=e.state||{stack:[],d:0};stack=(st.stack||[]).slice();
  go(stack[stack.length-1]);
  if(typeof st.y==="number")window.scrollTo(0,st.y);});
if("scrollRestoration" in history)history.scrollRestoration="manual";
function startFromUrl(){
  const h=(()=>{try{return decodeURIComponent(location.hash.slice(1));}catch(e){return "";}})();
  if(/^[bacst]./.test(h)){stack=[h];try{history.replaceState({stack:stack.slice(),d:0},"");}catch(e){}go(h);}
  else{try{history.replaceState({stack:[],d:0},"",urlOf([]));}catch(e){}}}
$("#home").addEventListener("keydown",e=>{if(e.key==="Enter"){goHome(false);}});
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);shown=40;tm=setTimeout(render,120);});
if(RK_ON){const n=document.getElementById("coverNote");if(n)n.innerHTML='表紙は本を開いたときに<a href="https://books.rakuten.co.jp/" target="_blank" rel="noopener">楽天ブックス</a>から読み込みます（<a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Supported by Rakuten Developers</a>）。';}
render();load();
</script>
