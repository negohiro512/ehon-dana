name: explore
on:
  push:
    branches: [suki-search]
    paths: ["tools/explore.mjs"]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/explore.mjs
      - run: |
          git config user.name "ehon-explore"
          git config user.email "actions@users.noreply.github.com"
          git add work/explore.md
          git diff --cached --quiet || (git commit -m "ためし" && git pull --rebase && git push)
